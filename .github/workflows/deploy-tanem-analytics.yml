name: Deploy TANEM Analytics

on:
  push:
    branches: [main]
    paths:
      - 'infra/tanem-analytics/**'
      - '.github/workflows/deploy-tanem-analytics.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/tanem-analytics
          secrets: |
            TELEGRAM_BOT_TOKEN
          command: deploy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
