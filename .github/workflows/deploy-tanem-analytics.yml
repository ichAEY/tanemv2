name: Deploy TANEM Analytics

on:
  push:
    branches: [main]
    paths:
      - 'infra/tanem-analytics/**'
      - '.github/workflows/deploy-tanem-analytics.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install analytics dependencies
        working-directory: infra/tanem-analytics
        run: npm install
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/tanem-analytics
          command: deploy
