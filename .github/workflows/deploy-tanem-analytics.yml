name: Deploy TANEM Analytics

on:
  push:
    branches: [main]
    paths:
      - 'infra/tanem-analytics/**'
      - '.github/workflows/deploy-tanem-analytics.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/tanem-analytics
          secrets: |
            TELEGRAM_BOT_TOKEN
          command: deploy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Verify Worker and connect Telegram webhook
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$WORKER_URL"
          curl --fail --silent --show-error "$WORKER_URL/health"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $TELEGRAM_BOT_TOKEN" \
            "$WORKER_URL/admin/setup-telegram"

      - name: Publish deployment URL
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          mkdir -p ops
          printf '{"worker_url":"%s"}\n' "$WORKER_URL" > ops/tanem-analytics-deployment.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/tanem-analytics-deployment.json
          git diff --cached --quiet && exit 0
          git commit -m "Record TANEM analytics deployment URL [skip ci]"
          git push
